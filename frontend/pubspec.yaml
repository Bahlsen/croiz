name: croiz
description: "A modern French crossword game built with Flutter and Riverpod."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  audioplayers: ^6.5.1
  dio: ^5.7.0
  flame_audio: ^2.6.0
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.0.0
  freezed_annotation: ^3.0.0
  go_router: ^17.0.1
  google_fonts: ^6.1.0
  intl: ^0.20.2
  json_annotation: ^4.8.0
  json_serializable: ^6.7.0
  logger: ^2.0.0
  shared_preferences: ^2.3.0
  sqflite: ^2.3.0
  uuid: ^4.0.0

  flutter: any
dev_dependencies:
  build_runner: ^2.6.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  golden_toolkit: ^0.15.0
  mockito: ^5.4.0
  mocktail: ^1.0.0

  flutter: any
  fake_async: any
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/data/
    - assets/data/atlantic/
    - assets/data/latimes/
    - assets/data/newsday/
    - assets/data/newyorker/
    - assets/data/nytimes/
    - assets/data/slate/
    - assets/data/universal/
    - assets/data/usatoday/
    - assets/data/wapost/
    - assets/data/wsj/
    - assets/audio/
    # Explicitly include nested year subdirectories for Android packaging
    # (Flutter does not include nested subdirectories automatically).
    # Atlantic
    - assets/data/atlantic/2020/
    - assets/data/atlantic/2021/
    - assets/data/atlantic/2022/
    # LA Times
    - assets/data/latimes/2020/
    - assets/data/latimes/2021/
    - assets/data/latimes/2022/
    - assets/data/latimes/2023/
    - assets/data/latimes/2024/
    - assets/data/latimes/2025/
    # Newsday
    - assets/data/newsday/2020/
    - assets/data/newsday/2021/
    - assets/data/newsday/2022/
    - assets/data/newsday/2023/
    # New Yorker
    - assets/data/newyorker/2020/
    - assets/data/newyorker/2021/
    - assets/data/newyorker/2022/
    - assets/data/newyorker/2023/
    # NYTimes
    - assets/data/nytimes/2020/
    - assets/data/nytimes/2021/
    - assets/data/nytimes/2022/
    - assets/data/nytimes/2023/
    - assets/data/nytimes/2024/
    - assets/data/nytimes/2025/
    # Slate
    - assets/data/slate/2024/
    # Universal
    - assets/data/universal/2020/
    - assets/data/universal/2021/
    - assets/data/universal/2022/
    - assets/data/universal/2023/
    - assets/data/universal/2024/
    - assets/data/universal/2025/
    # USA Today
    - assets/data/usatoday/2020/
    - assets/data/usatoday/2021/
    - assets/data/usatoday/2022/
    - assets/data/usatoday/2023/
    - assets/data/usatoday/2024/
    - assets/data/usatoday/2025/
    # Washington Post
    - assets/data/wapost/2022/
