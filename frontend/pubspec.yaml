name: croiz
description: "A modern French crossword game built with Flutter and Riverpod."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  audioplayers: ^6.5.1
  cupertino_icons: ^1.0.6
  dio: ^5.3.0
  flame_audio: ^2.11.12
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  flutter_secure_storage: ^9.0.0
  flutter_svg: ^2.0.0
  freezed_annotation: ^2.4.0
  go_router: ^12.0.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  json_annotation: ^4.8.0
  json_serializable: ^6.7.0
  logger: ^2.0.0
  path: ^1.8.0
  riverpod: ^2.4.0
  riverpod_generator: ^2.3.0
  sentry_flutter: ^9.8.0
  shared_preferences: ^2.3.0
  sqflite: ^2.3.0
  uuid: ^4.0.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.4.0
  golden_toolkit: ^0.13.0
  mockito: ^5.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/data/
    - assets/audio/

  # Uncomment and customize as needed:
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700
