name: croiz
description: "A modern French crossword game built with Flutter and Riverpod."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: ">=3.29.0"

dependencies:
  audioplayers: ^6.5.1
  confetti: ^0.8.0
  drift: ^2.30.0
  drift_flutter: ^0.2.8
  firebase_ai: ^3.6.0
  firebase_core: ^4.3.0
  fl_chart: ^1.1.1
  flame_audio: ^2.6.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.0.0
  freezed_annotation: ^3.0.0
  go_router: ^17.0.1
  google_fonts: ^6.1.0
  google_mobile_ads: ^7.0.0
  integration_test:
    sdk: flutter
  intl: ^0.20.2
  json_annotation: ^4.8.0
  json_serializable: ^6.7.0
  logger: ^2.0.0
  package_info_plus: ^8.1.2
  purchases_flutter: ^9.10.8
  purchases_ui_flutter: ^9.10.8
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.3.0
  sizer: ^3.1.3
  sqlite3_flutter_libs: ^0.5.41
  uuid: ^4.0.0

dev_dependencies:
  alchemist: ^0.13.0
  benchmark_harness: ^2.4.0
  build_runner: ^2.10.4
  custom_lint: ^0.8.1
  drift_dev: ^2.30.0
  fake_async: any
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  go_router_builder: ^4.1.3
  lints: ^6.0.0
  mockito: ^5.4.0
  mocktail: ^1.0.0
  patrol: ^4.1.0
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/data/
    - assets/data/atlantic/
    - assets/data/latimes/
    - assets/data/newsday/
    - assets/data/newyorker/
    - assets/data/nytimes/
    - assets/data/slate/
    - assets/data/universal/
    - assets/data/usatoday/
    - assets/data/wsj/
    - assets/data/generated/
    - assets/dictionaries/
    - assets/audio/
    # Explicitly include nested year subdirectories for Android packaging
    # (Flutter does not include nested subdirectories automatically).
    # Atlantic
    - assets/data/atlantic/2020/
    - assets/data/atlantic/2021/
    - assets/data/atlantic/2022/
    # LA Times
    - assets/data/latimes/2020/
    - assets/data/latimes/2021/
    - assets/data/latimes/2022/
    - assets/data/latimes/2023/
    - assets/data/latimes/2024/
    - assets/data/latimes/2025/
    # Newsday
    - assets/data/newsday/2020/
    - assets/data/newsday/2021/
    - assets/data/newsday/2022/
    - assets/data/newsday/2023/
    # New Yorker
    - assets/data/newyorker/2020/
    - assets/data/newyorker/2021/
    - assets/data/newyorker/2022/
    - assets/data/newyorker/2023/
    # NYTimes
    - assets/data/nytimes/2020/
    - assets/data/nytimes/2021/
    - assets/data/nytimes/2022/
    - assets/data/nytimes/2023/
    - assets/data/nytimes/2024/
    - assets/data/nytimes/2025/
    # Slate
    - assets/data/slate/2024/
    # Universal
    - assets/data/universal/2020/
    - assets/data/universal/2021/
    - assets/data/universal/2022/
    - assets/data/universal/2023/
    - assets/data/universal/2024/
    - assets/data/universal/2025/
    # USA Today
    - assets/data/usatoday/2020/
    - assets/data/usatoday/2021/
    - assets/data/usatoday/2022/
    - assets/data/usatoday/2023/
    - assets/data/usatoday/2024/
    - assets/data/usatoday/2025/
    # WSJ
    - assets/data/wsj/2020/
    - assets/data/wsj/2021/
    - assets/data/wsj/2022/
    - assets/data/wsj/2023/
    - assets/data/wsj/2024/
    - assets/data/wsj/2025/

  # Uncomment and customize as needed:
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
