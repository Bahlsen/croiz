name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (required for Android tooling)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        
      - name: Get dependencies
        run: |
          flutter pub get

      - name: Run tests
        if: success()
        run: flutter test

      - name: Run tests with coverage
        if: success()
        run:  flutter test --coverage

      - name: Analyze
        if: success()
        run: flutter analyze

      - name: Compute coverage and enforce threshold
        run: |
          dart frontend/tools/compute_coverage.dart --threshold=70

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: frontend/coverage/lcov.info
