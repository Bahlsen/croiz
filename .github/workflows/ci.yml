name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate puzzles per-origin indexes
        run: |
          echo "Running puzzles index generator"
          if ! python tools/generate_puzzles_metadata_index.py; then
            echo "::error::puzzles metadata index generator failed. See workflow logs for details."
            exit 1
          fi
          echo "Generator finished"
        # run from frontend (defaults.working-directory is frontend)

      - name: Cache generated puzzles index
        uses: actions/cache@v4
        with:
          path: |
            frontend/assets/data/puzzles_index_by_origin
          key: ${{ runner.os }}-puzzles-index-${{ hashFiles('frontend/tools/generate_puzzles_metadata_index.py', 'frontend/assets/data/puzzles.json') }}
          restore-keys: |
            ${{ runner.os }}-puzzles-index-

      - name: Verify generated per-origin index exists
        run: |
          if [ ! -d "assets/data/puzzles_index_by_origin" ]; then
            echo "Missing puzzles_index_by_origin"
            ls -la assets/data || true
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/flutter
            ~/.flutter
          key: ${{ runner.os }}-flutter-sdk-${{ hashFiles('frontend/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-sdk-
        
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            frontend/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Run tests with coverage
        working-directory: frontend
        shell: bash
        run: |
          set -e
          flutter test --coverage

      - name: Analyze
        if: success()
        run: flutter analyze

      - name: Compute coverage and enforce threshold
        if: success()
        run: |
          dart tools/compute_coverage.dart --threshold=80

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: frontend/coverage/lcov.info
