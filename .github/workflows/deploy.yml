name: Deploy to Production

on:
  release:
    types: [created]
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build API JAR
        working-directory: backend
        run: ./gradlew bootJar

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            frontend/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run integration tests
        run: |
          if [ -d integration_test ]; then
            echo "Running integration tests..."
            flutter test integration_test
          else
            echo "No integration_test directory found; skipping integration tests."
          fi

      # If you have device-driven integration tests (flutter drive), uncomment and configure the following
      # - name: Run device integration tests (requires emulator/device setup)
      #   working-directory: frontend
      #   run: |
      #     flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart

      - name: Build Flutter app for Android
        run: flutter build apk --release

      - name: Build Flutter app for iOS
        run: flutter build ios --release
        continue-on-error: true

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            backend/build/libs/croiz-api-*.jar
            frontend/build/app/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to container registry
        run: echo "Deploy to Docker registry or cloud platform"
        continue-on-error: true
