name: Deploy to Production

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build API JAR
        working-directory: backend
        run: ./gradlew bootJar

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'

      - name: Build Flutter app for Android
        working-directory: frontend
        run: flutter build apk --release

      - name: Build Flutter app for iOS
        working-directory: frontend
        run: flutter build ios --release
        continue-on-error: true

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            backend/build/libs/croiz-api-*.jar
            frontend/build/app/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to container registry
        run: echo "Deploy to Docker registry or cloud platform"
        continue-on-error: true
