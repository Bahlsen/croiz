name: Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - android
          - ios
          - both
      team_id:
        description: 'Optional Apple Developer Team ID for code signing'
        required: false
        type: string

defaults:
  run:
    working-directory: frontend

jobs:
  build-android:
    name: Build and Distribute Android APK
    if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Configure Gradle memory for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          echo "org.gradle.daemon=true" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx1536m" >> android/gradle.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: |
          flutter analyze | tee flutter_analyze.log
        continue-on-error: true

      - name: Upload analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-android-${{ github.sha }}
          path: frontend/flutter_analyze.log
          retention-days: 7

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: frontend/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-android-${{ github.sha }}
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    name: Build and Distribute iOS IPA
    if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create GoogleService-Info.plist from secret
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLESERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "IOS_GOOGLESERVICE_INFO_PLIST_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: |
          flutter analyze | tee flutter_analyze.log
        continue-on-error: true

      - name: Upload analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-ios-${{ github.sha }}
          path: frontend/flutter_analyze.log
          retention-days: 7

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Run tests
        run: flutter test

      - name: Set Xcode Development Team (optional)
        if: ${{ github.event.inputs.team_id != '' }}
        env:
          TEAM_ID: ${{ github.event.inputs.team_id }}
        run: |
          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"
          # Set DEVELOPMENT_TEAM for all build configurations
          sed -i '' "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ${TEAM_ID};/g" "$PROJECT_FILE"
          # Ensure CODE_SIGN_STYLE is manual to match ExportOptions.plist
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PROJECT_FILE"

      - name: Import signing certificate
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          # Decode certificate
          echo -n "$P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          
          # Create temporary keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          
          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          
          # Set key partition list
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH

      - name: Import provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          
          # Decode provisioning profile
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          
          # Copy to provisioning profiles directory
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_IOS }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: frontend/build/ios/ipa/*.ipa
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios-${{ github.sha }}
          path: frontend/build/ios/ipa/*.ipa
          retention-days: 30
